<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<!--   nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn   -->

 <link rel="manifest" href="manifest.json">    
   <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/ico" href="CoMaLaCom.ico">
    <link rel="apple-touch-icon" href="CoMaLaCom.ico>   
      <meta name="theme-color" content="#4B0082">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cofrinho Mágico">

   <!--   uuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuu   -->

  <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
 
 <div class="game-container">
          <h1>💲MOEDAS MÁGICAS<h1>  
      
<!-- Mensagens de feedback -->
  
 <div id="mensagem" class="mensagem"></div>

<!--   nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn   -->
 <!--    -->  
    <div style="display: flex; align-items: center; justify-content: center !important; gap: 2px; margin-bottom: 5px;">    
       <span id="indicadorAtividade" style="font-size: 3.5rem;">💰</span>.  . </span> 
       
</div>  
<!--   uuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuu   -->

        <!-- Painel do Saldo / Poupança -->
        <div class="painel">
         
 <div class="card">
             <div class="card-icon">🪙</div>
                <div class="card-label">Mesada atual</div>
                <div class="card-value" id="carteiraValue"style="font-size: 2.0rem;color: #FFD700">0</div>
            </div>
         <div class="card">
             <div class="card-icon">💰</div> 
        <div class="card-label">Total s/Juro</div>
         <div class="card-value" id="totalDepositadoValue"style="font-size: 2.0rem;color: #FFD700">0</div>
      <!--             <div class="card-value" id="totalValue">0</div>   -->
            </div>
            <div class="card highlight">
            <div class="card-icon">🐷</div>
                <div class="card-label">Poupança C/Juro</div>
                <div class="card-value" id="poupancaValue"style="font-size: 2.0rem;color: #FFD700">0</div>
            </div>
           
            <div class="card highlight-juros">
    <div class="card-icon">📈</div>
    <div class="card-label">Juro Mensal</div>
    <div class="card-value" id="jurosValue"style="font-size: 2.0rem;color: #FFD700">0</div>
</div>
        </div>
        
        <div class="recordes">
    <div>Recordes=</div>
    <div>🏆Poupança: <span id="recordePoupanca">0</span></div>
    <div>💲Juros: <span id="recordeJuros">0</span></div>
 <!--   <div>💲 Recorde Juros: <span id="recordeJuros">0</span></div> -->
</div>

<!-- Barra de evolução da poupança -->
  <div class="progress-area">
    <div class="progress-label">  💰 Evolução da poupança</div>
    <div class="progress-bg">
    <div id="progressPoupanca" class="progress-fill" style="width:0%">
          <span class="progress-icon">🐷</span>
    </div>
    </div>
    <div id="percentTexto" class="progress-percent">0% da meta</div>
</div>
    
   <!-- Botões de ação -->
        <div class="acoes">
            <button id="receberMesadaBtn" class="action-btn">Mesada (+10)</button>
             <button id="guardarBtn" class="action-btn">Poupar</button>
            
            <button id="avancarMêsBtn" class="action-btn especial">+ Mês (5%)</button>
            <button id="retirarBtn" class="action-btn">Sacar</button>
        </div>
     <!-- Meta atual -->
        <div class="meta-area">

      <div>🎯 Meta atual= <span id="metaNome">Bumerangue</span>:<span id="metaPreco">50</span> moedas</div>
              
    <button id="trocarMetaBtn" class="small-btn">Trocar meta</button>
    
   <button id="btnRegras" class="action-btn small">📜 Regras</button>
   
   <!--   <button id="btnRegras">📜 Regras</button>   -->

        <!-- Loja -->
        <div class="loja">
            <h2>🛍️ Lojinha mágica</h2>            <div class="itens">
                <div class="item" data-preco="50" data-nome="Bumerangue"data-simbolo="🪃">
                    <div class="item-icon"style="font-size: 2.5rem">🪃</div>
             <!--        <div>Bola</div>   -->
                     <div>50</div>
                    <button class="comprar-btn"style="font-size: 2.0rem;color: #00FF00">✓</button>
                </div>
                <div class="item" data-preco="150" data-nome="Livros"data-simbolo="📚">
                    <div class="item-icon"style="font-size: 2.5rem">📚</div>
           <!--          <div>Livros</div>  -->
                    <div>150</div>
                     <button class="comprar-btn"style="font-size: 2.0rem;color: #00FF00">✓</button>
                </div>
                <div class="item" data-preco="800" data-nome="Bicicleta"data-simbolo="🚴">
                    <div class="item-icon"style="font-size: 2.5rem">🚴</div>
             <!--        <div>Bike</div>   -->
                    <div>800</div>
                    <button class="comprar-btn"style="font-size: 2.0rem;color: #00FF00">✓</button>
                </div>  
              
              <div class="item" data-preco="300" data-nome="Drone"data-simbolo="🔅">
              
              <!-- <div class="item" data-preco="300" data-nome="Drone"data-simbolo="💢">   -->
                    <div class="item-icon"style="font-size: 2.5rem">"🔅"
                    </div>
           <!--          <div>Drone</div>   -->
                    <div>300</div>
                     <button class="comprar-btn"style="font-size: 2.0rem;color: #00FF00">✓</button>
              </div>
            
            <div class="item" data-preco="500" data-nome="Patinete"data-simbolo="🛴">
                    <div class="item-icon"style="font-size: 2.5rem">🛴</div>
            <!--         <div>Patins</div>   -->
                     <div>500</div>
                     <button class="comprar-btn"style="font-size: 2.0rem;color: #00FF00">✓</button>
            </div>
            
            <div class="footer">
    <button id="reiniciarBtn" class="action-btn small">🔄 Reiniciar</button>
</div>
<button id="iniciarTelaCheiaBtn" class="action-btn especial">🎮 Iniciar/Tela Cheia 🖥️</button>
   </div>
   </div>
           <!-- °°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°°° -->
           <!-- Modal (popup) para o Regras -->
    
<div id="regrasModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeRegrasModal">&times;</span>
         <div id="modal-body">
         
         </div>   <!-- ESSE É O ELEMENTO QUE RECEBE O TEXTO -->
    </div>
</div>

 <script src="script.js"></script>
 
   </body>
   </html>
